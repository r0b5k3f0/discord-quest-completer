[package]
name = "discord-quest-completer"
version = "26.7.30"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-sdk = "0.4.0"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# The default release profile ships a considerably larger binary than needed for
# an app whose Rust side only does IPC and file system work. Note that this
# deliberately does *not* set `panic = "abort"`: parts of the Tauri/wry stack
# rely on unwinding.
[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link time optimization across the whole dependency graph
codegen-units = 1    # Slower builds, smaller and faster output
strip = true         # Drop symbols from the shipped binary

[profile.release.package."*"]
opt-level = "z"
