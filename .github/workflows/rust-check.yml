name: Checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
  schedule:
    - cron: "0 0 */2 * *"   # every 2 days at midnight
  workflow_dispatch:
  
env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            x-target: 'win32-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Covers the cargo registry, the git index and both target directories.
      # Must come before any cargo invocation, otherwise that build is not
      # cached — src-win used to be compiled from scratch on every run.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./src-win -> target

      - name: Get Game List
        shell: bash
        env:
          GAME_LIST_URL: ${{ secrets.GAME_LIST_URL }}
        run: |
          # The game list is not committed to the repo. GAME_LIST_URL is
          # optional: without it the public mirror the app itself uses is
          # tried, then Discord directly.
          mkdir -p src/assets
          sources=()
          if [ -n "${GAME_LIST_URL:-}" ]; then
            sources+=("$GAME_LIST_URL")
          fi
          sources+=("https://r0b5k3f0.github.io/discord-quest-completer/detectable_v10.json")
          sources+=("https://discord.com/api/applications/detectable")

          for url in "${sources[@]}"; do
            echo "Trying $url"
            if curl -fsSL --retry 3 --retry-delay 5 -o src/assets/gamelist.json "$url" && [ -s src/assets/gamelist.json ]; then
              echo "Fetched the game list from $url"
              break
            fi
          done

          if [ ! -s src/assets/gamelist.json ]; then
            echo "::error::Could not obtain a game list from any source"
            exit 1
          fi

      # Build src-win
      - name: Build src-win project x86_64 binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-win
          cargo build --release --verbose
          cd ..
          cp ./src-win/target/release/src-win.exe ./src-tauri/resources/src-win.exe

      - name: install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          includeDebug: true

      - name: Create artifact for release
        id: create_artifact_for_release
        uses: actions/upload-artifact@v4
        with:
          name: tauri-win-release
          retention-days: 3
          # pick only the files we need for the release like the binary and the data folder
          # resource folders and installers.
          path: |
            src-tauri/target/release/discord-quest-completer.exe
            src-tauri/target/release/bundle/
            src-tauri/target/release/data/
            src-tauri/target/release/resources/

      - name: Create artifact (debug)
        id: create_artifact_debug
        uses: actions/upload-artifact@v4
        with:
          name: tauri-win-debug
          retention-days: 3
          path: |
            src-tauri/target/debug/discord-quest-completer.exe
            src-tauri/target/debug/bundle/
            src-tauri/target/debug/data/
            src-tauri/target/debug/resources/

  release-check:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: get version
        id: extract_version
        run: |
          version=$(date +"%Y.%m.%d")
          echo "version=$version" >> $GITHUB_ENV
        shell: bash
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          # artifcats: tauri-win-release, tauri-win-debug
          pattern: tauri-win-*
          merge-multiple: false

      - name: prepare files
        env:
          version: ${{ env.version }}
          win_build_release_dir: discord-quest-completer-win32-x64-${{ env.version }}
          win_build_debug_dir: discord-quest-completer-win32-x64-debug-${{ env.version }}
        run: |
          mkdir -p ./build/${{ env.win_build_release_dir }}
          cp tauri-win-release/discord-quest-completer.exe ./build/${{ env.win_build_release_dir }}/
          cp -r tauri-win-release/data/ ./build/${{ env.win_build_release_dir }}/
          cp -r tauri-win-release/resources/ ./build/${{ env.win_build_release_dir }}/
          zip -r ./build/${{ env.win_build_release_dir }}.zip ./build/${{ env.win_build_release_dir }}
          
          mkdir -p ./build/${{ env.win_build_debug_dir }}
          cp tauri-win-debug/discord-quest-completer.exe ./build/${{ env.win_build_debug_dir }}/
          cp -r tauri-win-debug/data/ ./build/${{ env.win_build_debug_dir }}/
          cp -r tauri-win-debug/resources/ ./build/${{ env.win_build_debug_dir }}/
          # zip -r ./build/${{ env.win_build_debug_dir }}.zip ./build/${{ env.win_build_debug_dir }}

          echo "win_build_release_dir=${{ env.win_build_release_dir }}" >> $GITHUB_ENV
          echo "win_build_debug_dir=${{ env.win_build_debug_dir }}" >> $GITHUB_ENV

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        env: 
          win_build_debug_dir: ${{ env.win_build_debug_dir }}
        with:
          name: ${{ env.win_build_debug_dir }}.zip
          retention-days: 3
          path: |
            ./build/${{ env.win_build_debug_dir }}
            
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        env: 
          win_build_release_dir: ${{ env.win_build_release_dir }}
        with:
          name: ${{ env.win_build_release_dir }}.zip
          retention-days: 3
          path: |
            ./build/${{ env.win_build_release_dir }}.zip

      - name: Upload Debug Bundles (Artifacts)
        uses: actions/upload-artifact@v4
        env: 
          version: ${{ env.version }}
        with:
          name: bundle-debug-${{ env.version }}.zip
          retention-days: 3
          path: |
            ./tauri-win-debug/bundle/**/*

      - name: Upload Release Bundles (Artifacts)
        uses: actions/upload-artifact@v4
        env: 
          version: ${{ env.version }}
        with:
          name: bundle-release-${{ env.version }}.zip
          retention-days: 3
          path: |
            ./tauri-win-release/bundle/**/*            
