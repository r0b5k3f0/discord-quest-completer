name: 'publish'

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            x-target: 'win32-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Covers the cargo registry, the git index and both target directories.
      # Must come before any cargo invocation, otherwise that build is not
      # cached — src-win used to be compiled from scratch on every run.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./src-win -> target

      - name: Get Game List
        shell: bash
        env:
          GAME_LIST_URL: ${{ secrets.GAME_LIST_URL }}
        run: |
          # The game list is not committed to the repo. GAME_LIST_URL is
          # optional: without it the public mirror the app itself uses is
          # tried, then Discord directly.
          mkdir -p src/assets
          sources=()
          if [ -n "${GAME_LIST_URL:-}" ]; then
            sources+=("$GAME_LIST_URL")
          fi
          sources+=("https://r0b5k3f0.github.io/discord-quest-completer/detectable_v10.json")
          sources+=("https://discord.com/api/applications/detectable")

          for url in "${sources[@]}"; do
            echo "Trying $url"
            if curl -fsSL --retry 3 --retry-delay 5 -o gamelist.raw.json "$url" && [ -s gamelist.raw.json ]; then
              echo "Fetched the game list from $url"
              break
            fi
          done

          if [ ! -s gamelist.raw.json ]; then
            echo "::error::Could not obtain a game list from any source"
            exit 1
          fi
          # Keep only the fields the app reads. The upstream list ships 14
          # fields per entry (~12 MB); this is the fallback that gets bundled
          # into the binary, so the other 9 are pure dead weight.
          jq -c '[.[] | {
                   id,
                   name,
                   aliases: (.aliases // []),
                   executables: [ (.executables // [])[] | { is_launcher, name, os } ],
                   third_party_skus: (.third_party_skus // [])
                 }]' gamelist.raw.json > src/assets/gamelist.json
          if [ ! -s src/assets/gamelist.json ]; then
            echo "Game list is empty after filtering"
            exit 1
          fi
          echo "Bundled game list: $(wc -c < src/assets/gamelist.json) bytes (raw: $(wc -c < gamelist.raw.json) bytes)"
          rm gamelist.raw.json

      # Build src-win
      - name: Build src-win project x86_64 binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-win
          cargo build --release --verbose
          cd ..
          cp ./src-win/target/release/src-win.exe ./src-tauri/resources/src-win.exe

      - name: install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      
      - name: Create artifact for release
        id: create_artifact_for_release
        uses: actions/upload-artifact@v4
        with:
          name: tauri-win-release
          path: |
            src-tauri/target/release/discord-quest-completer.exe
            src-tauri/target/release/bundle/
            src-tauri/target/release/data/
            src-tauri/target/release/resources/

  release:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: get version
        id: extract_version
        run: |
          version=$(date +"%Y.%m.%d")
          echo "version=$version" >> $GITHUB_ENV
        shell: bash

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-win-release
          path: tauri-win-release

      - name: prepare files
        env:
          version: ${{ env.version }}
          win_build_release_dir: discord-quest-completer-win32-x64-${{ env.version }}
        run: |
          mkdir -p ./build/${{ env.win_build_release_dir }}
          cp tauri-win-release/discord-quest-completer.exe ./build/${{ env.win_build_release_dir }}/
          cp -r tauri-win-release/data/ ./build/${{ env.win_build_release_dir }}/
          cp -r tauri-win-release/resources/ ./build/${{ env.win_build_release_dir }}/
          zip -r ./build/${{ env.win_build_release_dir }}.zip ./build/${{ env.win_build_release_dir }}
          echo "win_build_release_dir=${{ env.win_build_release_dir }}" >> $GITHUB_ENV

      - name: Create Build Artifacts
        uses: actions/upload-artifact@v4
        env: 
          win_build_release_dir: ${{ env.win_build_release_dir }}
        with:
          name: ${{ env.win_build_release_dir }}.zip
          path: | 
            ./build/${{ env.win_build_release_dir }}.zip
            tauri-win-release/bundle/**/*

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          name: Pre-Release ${{ env.version }}
          body: |
            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/markterence/discord-quest-completer/${{ env.version }}/${{ env.win_build_release_dir }}.zip)

            #### Disclaimer
            This tool is intended for educational purposes and personal use. Please respect Discord's terms of service and game publishers' rights when using this application.  
            
            The creators and maintainers of this project are not liable for any damages, account suspensions, or other consequences that may arise from using this software. Use at your own risk. This project is not affiliated with, endorsed by, or connected to Discord in any way.
          append_body: true
          generate_release_notes: true
          files: |
            ./build/${{ env.win_build_release_dir }}.zip
          prerelease: true
          draft: true
        env:
          version: ${{ env.version }}
          win_build_release_dir: ${{ env.win_build_release_dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
